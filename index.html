<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>⚡ Energy Real-time Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-power: #fbbf24; /* Electric Yellow/Orange */
            --accent-import: #38bdf8; /* Sky Blue */
            --accent-export: #4ade80; /* Soft Green */
        }

        body { 
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background: var(--bg-color); 
            color: var(--text-main); 
        }

        h1 { 
            text-align: center; 
            font-weight: 700; 
            margin-bottom: 40px; 
            font-size: 2.5rem;
            letter-spacing: -1px;
        }

        #data-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 20px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s ease;
        }

        .card:first-child {
            border: 2px solid var(--accent-power);
            transform: scale(1.02);
        }

        .time-box { 
            grid-column: 1 / 4; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 12px; 
            margin-bottom: 15px; 
            color: var(--text-dim); 
            font-size: 0.9em; 
            font-family: 'JetBrains Mono', monospace; 
        }

        .data-item { text-align: left; }
        
        .label { 
            display: block; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            font-weight: 600;
            letter-spacing: 1.5px; 
            color: var(--text-dim); 
            margin-bottom: 8px; 
        }

        .value { 
            display: block; 
            font-size: 2.8rem; /* Larger numbers */
            font-weight: 800; 
            line-height: 1;
        }

        .unit { 
            font-size: 1rem; 
            margin-left: 5px; 
            color: var(--text-dim); 
            font-weight: 400;
        }

        .power-value { color: var(--accent-power); }
        .import-value { color: var(--accent-import); font-size: 2.2rem; }
        .export-value { color: var(--accent-export); font-size: 2.2rem; }

        .status-badge {
            font-size: 0.7rem;
            padding: 4px 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            float: right;
        }

        @media (max-width: 600px) {
            .card { grid-template-columns: 1fr; text-align: center; }
            .data-item { text-align: center; margin-bottom: 20px; }
            .time-box { text-align: center; }
        }
    </style>
</head>
<body>
    <h1>🔌 Energy Monitor</h1>
    <div id="data-list">Loading data pipeline...</div>

    <script>
        async function update() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('data-list').innerHTML = '<div style="text-align:center">Waiting for sensor data stream...</div>';
                    return;
                }

                document.getElementById('data-list').innerHTML = data.map((d, index) => {
                    let dateString = "Unknown Time";
                    if (d.timestamp && d.timestamp._seconds) {
                        dateString = new Date(d.timestamp._seconds * 1000).toLocaleString();
                    } else if (d.timestamp) {
                        dateString = new Date(d.timestamp).toLocaleString();
                    }

                    // Format numbers to fixed decimals to show small values like 0.0071
                    const power = Number(d.active_power_w || 0).toFixed(1);
                    const imp = Number(d.total_import_kwh || 0).toFixed(4);
                    const exp = Number(d.total_export_kwh || 0).toFixed(4);

                    return `
                        <div class="card">
                            <div class="time-box">
                                ${dateString} 
                                <span class="status-badge">${index === 0 ? 'LIVE' : 'HISTORY'}</span>
                            </div>
                            
                            <div class="data-item">
                                <span class="label">Instant Power</span>
                                <span class="value power-value">${power}<span class="unit">W</span></span>
                            </div>
                            
                            <div class="data-item">
                                <span class="label">Import</span>
                                <span class="value import-value">${imp}<span class="unit">kWh</span></span>
                            </div>
                            
                            <div class="data-item">
                                <span class="label">Export</span>
                                <span class="value export-value">${exp}<span class="unit">kWh</span></span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('data-list').innerHTML = '<div style="text-align:center; color:#ef4444">⚠️ Connection Interrupted</div>';
            }
        }

        update();
        setInterval(update, 10000); // Updated to 10s to match your new Raspberry Pi interval
    </script>
</body>
</html>
